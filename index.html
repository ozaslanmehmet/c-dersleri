<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>C Programlama Canlı Ders Platformu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CodeMirror CSS & Tema -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  <style>
    :root {
      --bg: #1e1e2e;
      --sidebar-bg: #181825;
      --card-bg: #11111b;
      --text: #cdd6f4;
      --text-muted: #a6adc8;
      --accent: #89b4fa;
      --accent-hover: #b4befe;
      --danger: #f38ba8;
      --success: #a6e3a1;
      --border: #313244;
      --font-scale: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sol Panel: Ders Menüsü */
    aside {
      width: 320px;
      min-width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h2 { font-size: 16px; color: var(--accent); }
    .sidebar-header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    
    .lesson-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 8px;
    }
    .lesson-item {
      padding: 12px 14px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .lesson-item:hover { background: #313244; }
    .lesson-item.active { background: #45475a; border-left: 4px solid var(--accent); }
    .lesson-item .title { font-weight: 600; }
    .lesson-item .desc { font-size: 12px; color: var(--text-muted); }

    /* Sağ Panel: Çalışma ve Sunum Alanı */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow-y: auto;
    }

    /* Üst Bar (Tahta Kontrolleri) */
    header {
      padding: 10px 20px;
      background: var(--sidebar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .active-topic-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
    }
    .font-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-font {
      background: #313244;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }
    .btn-font:hover { background: #45475a; }

    /* Ders İçerik Alanı */
    .content-area {
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Öğretmen Pedagojik Vurgu Kutusu */
    .teacher-note {
      background: #181825;
      border-left: 4px solid #f9e2af;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.5;
    }
    .teacher-note strong { color: #f9e2af; display: block; margin-bottom: 4px; font-size: 13px; text-transform: uppercase; }

    /* Kod Editör Çerçevesi */
    .editor-wrapper {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #282a36;
    }
    .editor-toolbar {
      background: #21222c;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #44475a;
    }
    .editor-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-run { background: var(--accent); color: #11111b; }
    .btn-reset { background: #45475a; color: var(--text); }
    .btn-stdin { background: #313244; color: var(--text-muted); }

    .CodeMirror {
      height: auto;
      min-height: 200px;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: var(--font-scale);
      line-height: 1.5;
    }

    /* Katlanabilir stdin çekmecesi */
    .stdin-drawer {
      display: none;
      background: #1e1e2e;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
    .stdin-drawer label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .stdin-input {
      width: 100%;
      background: #11111b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 8px;
      font-family: monospace;
      font-size: 13px;
      border-radius: 4px;
    }

    /* Terminal Çıktı Ekranı */
    .terminal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .terminal-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .terminal-output {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: var(--font-scale);
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 60px;
    }
    .out-error { color: var(--danger); }
    .out-info { color: var(--text-muted); font-style: italic; }
  </style>
</head>
<body>

  <!-- Sol Menü: Ders Konuları -->
  <aside>
    <div class="sidebar-header">
      <h2>C Anlatım Modülleri</h2>
      <p>Canlı Anlatım & Akıllı Tahta</p>
    </div>
    <ul class="lesson-list" id="lessonList"></ul>
  </aside>

  <!-- Sağ Panel: Kodlama ve Çalıştırma -->
  <main>
    <header>
      <div class="active-topic-title" id="headerTopicTitle">Konu Yükleniyor...</div>
      <div class="font-controls">
        <span style="font-size: 12px; color: var(--text-muted);">Yazı Boyutu:</span>
        <button class="btn-font" onclick="changeFontSize(-1)">A-</button>
        <button class="btn-font" onclick="resetFontSize()">Sıfırla</button>
        <button class="btn-font" onclick="changeFontSize(1)">A+</button>
      </div>
    </header>

    <div class="content-area">
      <!-- Öğretmen Notu -->
      <div class="teacher-note">
        <strong>Öğretmen Vurgusu / Canlı Deney:</strong>
        <div id="teacherNoteText">-</div>
      </div>

      <!-- Editör Çerçevesi -->
      <div class="editor-wrapper">
        <div class="editor-toolbar">
          <span style="font-size: 12px; color: #6272a4; font-family: monospace;">main.c</span>
          <div class="editor-actions">
            <button class="btn btn-stdin" id="stdinBtn" onclick="toggleStdin()">Girdi (stdin)</button>
            <button class="btn btn-reset" onclick="resetActiveLessonCode()">İlk Koda Sıfırla</button>
            <button class="btn btn-run" id="runBtn" onclick="runActiveCode()">Çalıştır (Shift+Enter)</button>
          </div>
        </div>

        <textarea id="codeEditor"></textarea>

        <div class="stdin-drawer" id="stdinDrawer">
          <label>Programın scanf() için okuyacağı girdi:</label>
          <input type="text" id="stdinValue" class="stdin-input" placeholder="Girdi değeri">
        </div>
      </div>

      <!-- Çıktı Ekranı -->
      <div class="terminal-box">
        <div class="terminal-header">
          <span>Konsol Çıktısı</span>
          <span id="execStatus" style="color: var(--text-muted);">Hazır</span>
        </div>
        <div class="terminal-output" id="consoleOutput"><span class="out-info">Kodu çalıştırmak için [Çalıştır] butonuna tıklayın veya Shift + Enter yapın...</span></div>
      </div>
    </div>
  </main>

  <!-- CodeMirror JS & Modları -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

  <script>
    // Canlı Anlatım Müfredatı ve Örnek Kodlar
    const lessons = [
      {
        id: "format-specifiers",
        title: "1. Format Belirleyiciler & Taşma",
        desc: "int vs float dönüşümleri ve %d, %f farkı",
        note: "printf içindeki %d ifadesini %f veya %.2f yaparak tür uyumsuzluğunu ve çıktıdaki değişimi gösterin.",
        code: `#include <stdio.h>

int main() {
    int tamSayi = 7;
    int bolen = 2;
    
    // Değişim: (float)tamSayi / bolen yaparak kesirli sonucu inceleyin
    float sonuc = tamSayi / bolen;
    
    printf("Bolum Sonucu: %f\\n", sonuc);
    return 0;
}`,
        stdin: ""
      },
      {
        id: "short-circuit",
        title: "2. Mantıksal Operatörler (Kısa Devre)",
        desc: "&& ve || operatörlerinin yan etkileri",
        note: "Koşuldaki ilk ifadeyi (a == 0) yerine (a == 10) yapın. İkinci kısımdaki (b++) işleminin çalışıp çalışmadığını b'nin değerinden inceleyin.",
        code: `#include <stdio.h>

int main() {
    int a = 0;
    int b = 5;
    
    // a sıfır olduğu için sağ taraf (b++) değerlendirilecek mi?
    if (a != 0 && ++b > 5) {
        printf("Kosul saglandi\\n");
    }
    
    printf("a: %d, b: %d\\n", a, b);
    return 0;
}`,
        stdin: ""
      },
      {
        id: "off-by-one",
        title: "3. Döngü Sınırları (Off-by-One)",
        desc: "<= ve < farkının bellek üzerindeki etkisi",
        note: "Döngüdeki 'i <= 5' ifadesini 'i < 5' yapın. Eleman sayısıyla indeks sınırının ilişkisini gösterin.",
        code: `#include <stdio.h>

int main() {
    int dizi[5] = {10, 20, 30, 40, 50};
    
    // Hata denemesi: Sınırı 5 yerine 4 veya 5 yaparak sınır aşımını gözlemleyin
    for (int i = 0; i <= 5; i++) {
        printf("Indeks %d: %d\\n", i, dizi[i]);
    }
    
    return 0;
}`,
        stdin: ""
      },
      {
        id: "pointers-intro",
        title: "4. Göstericiler (Pointer) Mantığı",
        desc: "Değer ile adres arasındaki ilişki",
        note: "'*p = 99' satırını yorum satırı yapın veya 'p = &y' şeklinde adresi değiştirip x'in etkilenip etkilenmediğini gösterin.",
        code: `#include <stdio.h>

int main() {
    int x = 42;
    int *p = &x;
    
    printf("x'in ilk degeri: %d\\n", x);
    printf("x'in adresi (&x): %p\\n", (void*)&x);
    
    // Degisim: isaretci uzerinden degeri degistirelim
    *p = 99;
    
    printf("x'in yeni degeri: %d\\n", x);
    return 0;
}`,
        stdin: ""
      }
    ];

    let activeLessonIndex = 0;
    let editor;
    let currentFontSize = 16;

    // CodeMirror Başlatma
    window.addEventListener('DOMContentLoaded', () => {
      editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
        mode: "text/x-csrc",
        theme: "dracula",
        lineNumbers: true,
        matchBrackets: true,
        indentUnit: 4,
        extraKeys: {
          "Shift-Enter": function() { runActiveCode(); },
          "Ctrl-Enter": function() { runActiveCode(); }
        }
      });

      renderSidebar();
      loadLesson(0);
    });

    // Menüyü Çiz
    function renderSidebar() {
      const list = document.getElementById('lessonList');
      list.innerHTML = "";
      lessons.forEach((l, idx) => {
        const li = document.createElement('li');
        li.className = `lesson-item ${idx === activeLessonIndex ? 'active' : ''}`;
        li.innerHTML = `<span class="title">${l.title}</span><span class="desc">${l.desc}</span>`;
        li.onclick = () => loadLesson(idx);
        list.appendChild(li);
      });
    }

    // Seçili Konuyu Yükle
    function loadLesson(index) {
      activeLessonIndex = index;
      renderSidebar();

      const lesson = lessons[index];
      document.getElementById('headerTopicTitle').textContent = lesson.title;
      document.getElementById('teacherNoteText').textContent = lesson.note;
      document.getElementById('stdinValue').value = lesson.stdin;

      editor.setValue(lesson.code);
      editor.clearHistory();

      // stdin kutusu doluysa açık tut
      const drawer = document.getElementById('stdinDrawer');
      drawer.style.display = lesson.stdin ? 'block' : 'none';

      document.getElementById('consoleOutput').innerHTML = '<span class="out-info">Kodu çalıştırmak için [Çalıştır] butonuna tıklayın veya Shift + Enter yapın...</span>';
      document.getElementById('execStatus').textContent = "Hazır";
    }

    // İlk Koda Sıfırla
    function resetActiveLessonCode() {
      const lesson = lessons[activeLessonIndex];
      editor.setValue(lesson.code);
      document.getElementById('stdinValue').value = lesson.stdin;
      document.getElementById('consoleOutput').innerHTML = '<span class="out-info">Kod özgün haline sıfırlandı.</span>';
    }

    // Standart Girdi Çekmecesini Aç/Kapat
    function toggleStdin() {
      const drawer = document.getElementById('stdinDrawer');
      drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
    }

    // Font Boyutu Kontrolleri
    function changeFontSize(delta) {
      currentFontSize = Math.max(12, Math.min(28, currentFontSize + delta * 2));
      document.documentElement.style.setProperty('--font-scale', currentFontSize + 'px');
      editor.refresh();
    }

    function resetFontSize() {
      currentFontSize = 16;
      document.documentElement.style.setProperty('--font-scale', '16px');
      editor.refresh();
    }

    // Wandbox API ile Derleme & Çalıştırma
    async function runActiveCode() {
      const runBtn = document.getElementById('runBtn');
      const output = document.getElementById('consoleOutput');
      const status = document.getElementById('execStatus');
      const code = editor.getValue();
      const stdin = document.getElementById('stdinValue').value;

      runBtn.disabled = true;
      status.textContent = "Derleniyor...";
      output.innerHTML = '<span class="out-info">Derleniyor ve çalıştırılıyor...</span>';

      try {
        const response = await fetch('https://wandbox.org/api/compile.json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            compiler: 'gcc-head-c',
            code: code,
            stdin: stdin
          })
        });

        if (!response.ok) {
          throw new Error(`API Hatası (Kod: ${response.status})`);
        }

        const data = await response.json();
        let result = "";

        if (data.compiler_error) {
          result += `<span class="out-error">[Derleme Hatası]\n${escapeHtml(data.compiler_error)}</span>\n`;
        }
        if (data.program_error) {
          result += `<span class="out-error">[stderr]\n${escapeHtml(data.program_error)}</span>\n`;
        }
        if (data.program_output) {
          result += escapeHtml(data.program_output);
        }

        output.innerHTML = result || '<span class="out-info">[Program herhangi bir çıktı üretmeden sonlandı]</span>';
        status.textContent = "Tamamlandı";
      } catch (err) {
        output.innerHTML = `<span class="out-error">[Bağlantı Hatası]\n${escapeHtml(err.message)}</span>`;
        status.textContent = "Hata";
      } finally {
        runBtn.disabled = false;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
